version: '3.8'

services:
  ayan-portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ayan-devops-portfolio
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
